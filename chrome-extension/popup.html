<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkVault Saver</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="brand-emoji">🔖</span>
        <span class="brand-name">LinkVault Saver</span>
      </div>
    </header>

    <!-- Main Dynamic Content -->
    <main class="popup-body">
      <!-- 1. Loading State -->
      <div id="loadingState" class="state-box">
        <div class="spinner"></div>
        <p class="state-text">Reading product details...</p>
      </div>

      <!-- 2. Preview & Inputs (Shown on Success) -->
      <div id="contentSection" class="content-section" style="display: none;">
        <!-- Preview Card -->
        <div id="previewCard" class="preview-card">
          <div class="thumbnail-box">
            <img id="previewImage" src="" alt="Thumbnail" class="thumbnail-img" />
            <div id="imagePlaceholder" class="thumbnail-placeholder" style="display: none;">
              <span>🛍️</span>
            </div>
          </div>
          <div class="card-details">
            <span id="domainBadge" class="domain-badge">shopee.ph</span>
            <h2 id="previewTitle" class="card-title">Product Title</h2>
          </div>
        </div>

        <!-- Form Fields -->
        <form id="saveForm" class="link-form" novalidate>
          <!-- Field 1: Target Category (UA / WA / MA) -->
          <div class="form-group">
            <label for="categorySelect" class="form-label">
              <span>Save to Category</span>
            </label>
            <select id="categorySelect" class="form-input form-select">
              <option value="UA" selected>UA (Main Category)</option>
              <option value="WA">WA (Main Category)</option>
              <option value="MA">MA (Main Category)</option>
            </select>
          </div>

          <!-- Field 2: Page URL (Auto-filled, Read-only) -->
          <div class="form-group">
            <label for="pageUrlInput" class="form-label">
              <span>Product page</span>
              <span class="label-badge">Auto-detected</span>
            </label>
            <input
              id="pageUrlInput"
              type="text"
              class="form-input form-input-readonly"
              readonly
              tabindex="-1"
              value=""
            />
          </div>

          <!-- Field 3: Affiliate link (Manual input, Optional) -->
          <div class="form-group">
            <label for="affiliateLinkInput" class="form-label">
              <span>Affiliate link <span class="optional-pill">(Optional)</span></span>
            </label>
            <div class="input-wrapper">
              <input
                id="affiliateLinkInput"
                type="url"
                class="form-input form-input-affiliate"
                placeholder="Paste affiliate shortlink (or leave blank)"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                id="pasteBtn"
                type="button"
                class="btn-paste"
                title="Paste from clipboard"
              >
                Paste
              </button>
            </div>
            <p class="field-hint">You can save now and add the affiliate link later in LinkVault.</p>
          </div>
        </form>
      </div>

      <!-- 3. Failure State -->
      <div id="errorState" class="state-box error-box" style="display: none;">
        <span class="error-emoji">😕</span>
        <p id="errorMessage" class="error-text">
          Open a product page (Shopee, TikTok, Lazada, Amazon) to save
        </p>
      </div>
    </main>

    <!-- Actions Section -->
    <section class="popup-footer">
      <button id="saveBtn" class="btn-save" style="display: none;">
        Save to LinkVault
      </button>
      <div id="statusToast" class="status-toast" style="display: none;"></div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
